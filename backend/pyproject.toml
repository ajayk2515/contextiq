[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "docling",
    "docling.*",
    "docling_core",
    "docling_core.*",
    "fastembed",
    "fastembed.*",
    "openai",
    "openai.*",
    "numpy",
    "numpy.*",
    "qdrant_client",
    "qdrant_client.*",
    "ragas",
    "ragas.*",
    "tiktoken",
    "tiktoken.*",
]
follow_imports = "skip"
